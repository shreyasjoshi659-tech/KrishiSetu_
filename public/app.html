<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KrishiSetu – Farmer Pools & Dashboard</title>
  <meta name="description" content="KrishiSetu farmer companion: pool your harvest, agree on one price and sell directly to processors and wholesalers." />
  <meta name="theme-color" content="#0b1a12" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app">
    <!-- Top right language dropdown on main website -->
    <div class="app-top-lang" id="app-top-lang"></div>

    <aside class="side">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#07130c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M12 10C12 6 9 4 5 4c0 4 2 6 7 6Z"/><path d="M12 13c0-3 2.5-5 7-5 0 4-2.5 6-7 5Z"/></svg></div>
        <div>
          <div class="brand-name">Krishi<span>Setu</span></div>
          <div class="brand-desc" style="font-size:0.75rem; color:var(--muted);" data-i18n="brand_sub">Farmer Collective</div>
        </div>
      </div>

      <div id="side-lang"></div>

      <nav class="nav" id="nav"></nav>
      <div class="spacer"></div>
      <button type="button" class="user-pill clickable" id="user-pill" title="Click your name to change registration details" style="all:unset; box-sizing:border-box; display:flex; align-items:center; gap:10px; padding:8px 14px 8px 8px; border-radius:999px; background:var(--surface); border:1px solid var(--border); cursor:pointer; width:100%; transition:all .2s ease;">
        <div class="avatar" id="avatar">K</div>
        <div style="display:flex; flex-direction:column; line-height:1.2; min-width:0;">
          <span id="uname" style="font-weight:700; color:var(--text); font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
          <small style="font-size:0.72rem; color:var(--gold);" data-i18n="edit_details">Click name to edit details</small>
        </div>
      </button>
      <button class="btn ghost" id="logout"><span data-i18n="btn_logout">Log out</span></button>
    </aside>

    <main class="main" id="view" aria-live="polite"></main>
    <nav class="bottom-nav" id="bnav"></nav>
  </div>
  <div id="toasts" class="toasts"></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/pools.js"></script>
  <script src="/js/labour.js"></script>
  <script src="/js/gear.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
