<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KrishiSetu (कृषि सेतु) – Farmer Collective Portal</title>
  <meta name="description" content="KrishiSetu (कृषि सेतु) portal for Indian farmers: pool crops, negotiate minimum collective rate, and connect directly with food processors." />
  <meta name="theme-color" content="#0d1b14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="app">
    <!-- Top right language dropdown on main website -->
    <div class="app-top-lang" id="app-top-lang"></div>

    <aside class="side">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22V10"/><path d="M12 10C12 6 9 4 5 4c0 4 2 6 7 6Z"/><path d="M12 13c0-3 2.5-5 7-5 0 4-2.5 6-7 5Z"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Krishi<span>Setu</span></div>
          <div class="brand-desc">कृषि सेतु · Farmer Collective</div>
        </div>
      </div>

      <div id="side-lang"></div>

      <nav class="nav" id="nav"></nav>
      <div class="spacer"></div>
      <div class="user-pill">
        <div class="avatar" id="avatar">K</div>
        <div style="min-width:0; flex:1;">
          <b id="uname" style="display:block; font-size:0.9rem; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">Farmer</b>
          <small id="uplace" style="display:block; font-size:0.75rem; color:var(--text-muted); text-overflow:ellipsis; overflow:hidden; white-space:nowrap;"></small>
        </div>
      </div>
      <button class="btn ghost" id="logout" style="width:100%; justify-content:center; padding:8px 12px; font-size:0.85rem;">
        <span data-i18n="btn_logout">Log out</span>
      </button>
    </aside>

    <main class="main" id="view" aria-live="polite"></main>
    <nav class="bottom-nav" id="bnav"></nav>
  </div>
  <div id="toasts" class="toasts"></div>

  <script src="./js/i18n.js"></script>
  <script src="./js/mock-api.js"></script>
  <script src="./js/pools.js"></script>
  <script src="./js/labour.js"></script>
  <script src="./js/gear.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
